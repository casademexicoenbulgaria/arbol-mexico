<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa de México en Bulgaria — Árbol interactivo</title>
<style>
  :root{
    --parch:#F3ECD6; --parch-2:#EBE0C2; --parch-3:#E3D6B2;
    --green-900:#123324; --green-800:#173d2b; --green-700:#1E4A34; --green-600:#2E5D43;
    --gold:#C6A24C; --gold-bright:#E4C070; --gold-soft:#D8BE86;
    --ink:#3B2F21; --ink-soft:#5C4B36; --red:#B4232E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(120% 60% at 50% 0%, #F7F1DE 0%, var(--parch) 55%, var(--parch-2) 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5; padding:0 0 64px;
  }
  .page{max-width:660px;margin:0 auto;padding:0 16px}

  /* ---------- Hero + clickable tree ---------- */
  .hero{padding:20px 0 4px}
  .hero-frame{
    border:1px solid var(--gold); border-radius:14px; overflow:hidden;
    box-shadow:0 8px 30px rgba(30,74,52,.18), inset 0 0 0 4px rgba(255,255,255,.35);
    background:#fff;
  }
  .hero-stage{position:relative; display:block; font-size:0}
  .hero-stage img{display:block; width:100%; height:auto}

  .hotspot{
    position:absolute; margin:0; padding:0; border:0; background:transparent;
    cursor:pointer; border-radius:6px; -webkit-tap-highlight-color:transparent;
    transition:background .15s ease, box-shadow .15s ease;
  }
  /* branch (category) zones -> gold */
  .hotspot:hover, .hotspot:focus-visible{
    background:rgba(228,192,112,.30);
    box-shadow:0 0 0 2px var(--gold-bright), 0 0 12px rgba(228,192,112,.5); outline:none;
  }
  .hero-stage.show-zones .hotspot{ background:rgba(228,192,112,.20); box-shadow:0 0 0 2px var(--gold-bright); }
  /* theme (sub) zones -> green, overrides the gold rules above */
  .hotspot.subspot:hover, .hotspot.subspot:focus-visible{
    background:rgba(46,93,67,.30);
    box-shadow:0 0 0 2px var(--green-600), 0 0 10px rgba(46,93,67,.45); outline:none;
  }
  .hero-stage.show-zones .hotspot.subspot{ background:rgba(46,93,67,.16); box-shadow:0 0 0 1px var(--green-600); }

  .tree-hint{
    display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
    margin:12px 0 2px; color:var(--ink-soft); font-size:.9rem; text-align:center;
  }
  .ghost-btn{
    font-family:inherit; font-size:.82rem; cursor:pointer; color:var(--green-700);
    background:var(--parch); border:1px solid var(--gold); border-radius:999px; padding:6px 14px;
    transition:background .15s ease;
  }
  .ghost-btn:hover{background:var(--parch-2)}
  .ghost-btn:focus-visible{outline:2px solid var(--green-600); outline-offset:2px}
  .legend{
    display:none; justify-content:center; gap:16px; margin:6px 0 0; font-size:.78rem; color:var(--ink-soft);
  }
  .legend.show{display:flex}
  .legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
  .legend .gold{background:rgba(228,192,112,.55);box-shadow:0 0 0 1px var(--gold-bright) inset}
  .legend .grn{background:rgba(46,93,67,.35);box-shadow:0 0 0 1px var(--green-600) inset}

  .lead{ text-align:center; padding:14px 6px 8px }
  .eyebrow{font-size:.72rem; letter-spacing:.22em; text-transform:uppercase; color:var(--green-600); font-weight:600}
  .lead h1{font-family:Georgia,"Times New Roman",serif; font-size:1.4rem; line-height:1.2; margin:.35em 0 .15em; color:var(--green-900)}
  .lead p{margin:.2em auto 0; max-width:36ch; color:var(--ink-soft); font-size:.95rem}
  .rule{width:120px;height:1px;margin:14px auto 4px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .flower{color:var(--gold);font-style:normal}

  /* ---------- Category plaques (menu) ---------- */
  .cats{margin-top:12px;display:flex;flex-direction:column;gap:12px}
  .cat{
    border:1px solid rgba(198,162,76,.55); border-radius:12px; overflow:hidden;
    background:var(--parch); box-shadow:0 2px 10px rgba(30,74,52,.06);
    scroll-margin-top:14px; transition:box-shadow .3s ease;
  }
  .cat.flash{box-shadow:0 0 0 3px var(--gold-bright), 0 6px 20px rgba(30,74,52,.18)}
  .cat-head{
    width:100%; text-align:left; cursor:pointer; display:flex; align-items:center; gap:12px;
    padding:16px; background:linear-gradient(180deg,var(--green-800),var(--green-900));
    color:var(--gold-bright); border:0; border-bottom:1px solid rgba(198,162,76,.35);
    font-family:inherit; box-shadow:inset 0 0 0 1px rgba(228,192,112,.22);
  }
  .cat-head .fl{font-size:1rem;color:var(--gold);line-height:1}
  .cat-head .name{font-family:Georgia,"Times New Roman",serif;font-size:1.16rem;font-weight:600;letter-spacing:.02em;color:var(--gold-bright);flex:1}
  .chev{color:var(--gold-soft);font-size:1.1rem;line-height:1;transition:transform .28s ease;flex:0 0 auto}
  .cat.open .chev{transform:rotate(90deg)}
  .cat-head:focus-visible{outline:3px solid var(--gold-bright);outline-offset:-3px}

  .collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
  .collapse.open{grid-template-rows:1fr}
  .collapse > .inner{overflow:hidden}

  .cat-body{padding:14px 16px 6px}
  .cat-intro{margin:0 0 12px;color:var(--ink-soft);font-size:.96rem;font-style:italic;border-left:3px solid var(--gold);padding-left:12px}

  .subs{display:flex;flex-direction:column}
  .sub{border-top:1px solid rgba(198,162,76,.35); transition:background .35s ease; border-radius:6px}
  .sub:first-child{border-top:0}
  .sub.subflash{background:rgba(228,192,112,.38)}
  .sub-head{
    width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:13px 8px;min-height:46px;background:transparent;border:0;font-family:inherit;
    color:var(--green-700);font-size:1rem;font-weight:600;
  }
  .sub-head .dot{color:var(--gold);font-size:.7rem;line-height:1;flex:0 0 auto}
  .sub-head .sname{flex:1}
  .sub-head .plus{color:var(--gold);font-size:1.15rem;line-height:1;flex:0 0 auto;transition:transform .25s ease;font-weight:400}
  .sub.open .sub-head .plus{transform:rotate(45deg)}
  .sub-head:focus-visible{outline:2px solid var(--green-600);outline-offset:2px;border-radius:6px}
  .sub-desc{padding:0 8px 14px 24px;margin:0;color:var(--ink);font-size:.93rem}
  .sub-desc-inner{background:var(--parch-2);border-left:3px solid var(--gold-soft);padding:10px 12px;border-radius:0 8px 8px 0}

  footer{text-align:center;margin-top:30px;color:var(--ink-soft);font-size:.85rem}
  footer .flags{font-size:1.3rem;letter-spacing:.15em}
  footer .motto{font-family:Georgia,serif;color:var(--green-700);letter-spacing:.08em;margin-top:6px}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>

/* ---- Render del menú ---- */
const cats = document.getElementById('cats');
DATA.forEach((cat, i) => {
  const el = document.createElement('div');
  el.className = 'cat';
  const subsHtml = cat.subs.map((s) => `
    <div class="sub">
      <button class="sub-head" type="button" aria-expanded="false">
        <span class="dot">◆</span><span class="sname">${esc(s.name)}</span>
        <span class="plus" aria-hidden="true">+</span>
      </button>
      <div class="collapse"><div class="inner">
        <div class="sub-desc"><div class="sub-desc-inner">${esc(s.desc)}</div></div>
      </div></div>
    </div>`).join('');
  el.innerHTML = `
    <button class="cat-head" type="button" aria-expanded="false">
      <span class="fl" aria-hidden="true">❋</span>
      <span class="name">${esc(cat.title)}</span>
      <span class="chev" aria-hidden="true">›</span>
    </button>
    <div class="collapse"><div class="inner">
      <div class="cat-body">
        <p class="cat-intro">${esc(cat.intro)}</p>
        <div class="subs">${subsHtml}</div>
      </div>
    </div></div>`;
  cats.appendChild(el);
});
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const stage = document.getElementById('stage');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- Build BRANCH hotspots (added first, so they sit under sub zones) ---- */
HOTSPOTS.forEach(([ci, l, t, w, h]) => {
  const b = mkHot(l,t,w,h,'Ir a ' + (DATA[ci]?DATA[ci].title:''));
  b.addEventListener('click', () => openCategory(ci, true));
  stage.appendChild(b);
});
/* ---- Build THEME (sub) hotspots ---- */
SUBHOTS.forEach(([ci, si, l, t, w, h]) => {
  const label = (DATA[ci] && DATA[ci].subs[si]) ? DATA[ci].subs[si].name : '';
  const b = mkHot(l,t,w,h,'Ir a ' + label);
  b.classList.add('subspot');
  b.addEventListener('click', () => openSub(ci, si));
  stage.appendChild(b);
});
function mkHot(l,t,w,h,label){
  const b=document.createElement('button');
  b.type='button'; b.className='hotspot';
  b.style.left=l+'%'; b.style.top=t+'%'; b.style.width=w+'%'; b.style.height=h+'%';
  b.setAttribute('aria-label', label);
  return b;
}

/* ---- Open / close helpers ---- */
function setCatOpen(catEl, open){
  catEl.classList.toggle('open', open);
  catEl.querySelector('.cat-head').setAttribute('aria-expanded', String(open));
  catEl.querySelector('.collapse').classList.toggle('open', open);
}
function setSubOpen(subEl, open){
  subEl.classList.toggle('open', open);
  subEl.querySelector('.sub-head').setAttribute('aria-expanded', String(open));
  subEl.querySelector('.collapse').classList.toggle('open', open);
}
function scrollToEl(el, block){
  const d = reduce ? 0 : 300;               // wait for expand animation
  setTimeout(() => el.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block}), d);
}
function openCategory(i, scroll){
  const target = cats.children[i];
  if(!target) return;
  [...cats.children].forEach(c => { if(c !== target) setCatOpen(c, false); });
  setCatOpen(target, true);
  if(scroll){
    scrollToEl(target, 'start');
    target.classList.add('flash');
    setTimeout(() => target.classList.remove('flash'), 1300);
  }
}
function openSub(ci, si){
  const cat = cats.children[ci];
  if(!cat) return;
  [...cats.children].forEach(c => { if(c !== cat) setCatOpen(c, false); });
  setCatOpen(cat, true);
  const sub = cat.querySelectorAll('.sub')[si];
  if(!sub) return;
  setSubOpen(sub, true);
  scrollToEl(sub, 'center');
  sub.classList.add('subflash');
  setTimeout(() => sub.classList.remove('subflash'), 1300);
}

/* ---- Menu interactions (toggle) ---- */
cats.addEventListener('click', (e) => {
  const catBtn = e.target.closest('.cat-head');
  const subBtn = e.target.closest('.sub-head');
  if (catBtn){
    const cat = catBtn.parentElement;
    const willOpen = !cat.classList.contains('open');
    [...cats.children].forEach(c => { if(c !== cat) setCatOpen(c, false); });
    setCatOpen(cat, willOpen);
    return;
  }
  if (subBtn){
    const sub = subBtn.parentElement;
    setSubOpen(sub, !sub.classList.contains('open'));
  }
});

/* ---- "Resaltar zonas" toggle ---- */
const zonesBtn = document.getElementById('zonesBtn');
const legend = document.getElementById('legend');
zonesBtn.addEventListener('click', () => {
  const on = stage.classList.toggle('show-zones');
  legend.classList.toggle('show', on);
  zonesBtn.textContent = on ? 'Ocultar zonas' : 'Resaltar zonas';
});
